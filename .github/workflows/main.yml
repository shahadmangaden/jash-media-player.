name: Build Jash Media Player APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack Kotlin Project & Remove HTML Preview
        run: |
          if [ -f "Jash-Media-Player-GitHub-Repo.zip" ]; then
            unzip -o Jash-Media-Player-GitHub-Repo.zip
            rm -f Jash-Media-Player-GitHub-Repo.zip Jash_Media_Player*.html
            git config user.name "Jash Builder"
            git config user.email "builder@jash.app"
            git add -A
            git commit -m "Unpack pure Kotlin Android project structure" || true
            git push origin HEAD:main || true
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Release Signing Keystore Exists
        run: |
          if [ ! -f "app/jash-release-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore app/jash-release-key.jks \
              -alias jashkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass jashplayer123 \
              -keypass jashplayer123 \
              -dname "CN=Jash Media Player, OU=Mobile, O=Jash, L=Dubai, S=Dubai, C=AE"
          fi

      - name: Compile Debug & Signed Release APKs
        run: |
          gradle assembleDebug assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Jash-Media-Player-v1.0.0-Signed-Release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/Jash-Media-Player-v1.0.0-Debug.apk

      - name: Upload Signed Release APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Jash-Media-Player-Signed-Release-APK
          path: dist/Jash-Media-Player-v1.0.0-Signed-Release.apk

      - name: Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Jash Media Player v1.0.${{ github.run_number }} (Pure iOS UI + All Codecs)"
          body: |
            ### Tap Below under "Assets" to Download & Install on Your Phone:
            - **`Jash-Media-Player-v1.0.0-Signed-Release.apk`** (Signed Release — install directly on Android)
            - **`Jash-Media-Player-v1.0.0-Debug.apk`**
          files: |
            dist/Jash-Media-Player-v1.0.0-Signed-Release.apk
            dist/Jash-Media-Player-v1.0.0-Debug.apk
